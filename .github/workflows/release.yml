name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v*.*.* tag to recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release tag and package version
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a v*.*.* release tag, got: $REQUESTED_TAG" >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Requested tag $REQUESTED_TAG resolves to $tag_commit, but checkout is $head_commit" >&2
            exit 1
          fi
          package_version=$(node -p "require('./package.json').version")
          if [ "$REQUESTED_TAG" != "v$package_version" ]; then
            echo "Requested tag $REQUESTED_TAG does not match package version v$package_version" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - run: npm run release:check
      - name: Confirm recovered GitHub release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.release.outputs.tag }}"
      - name: Check npm publication state
        id: npm
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "prpack@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
      - run: npm pack
      - name: Generate release notes
        run: |
          if ! npm run --silent release:notes --if-present -- . > RELEASE_NOTES.md || [ ! -s RELEASE_NOTES.md ]; then
            echo "## Changes" > RELEASE_NOTES.md
            git log --oneline --max-count=20 >> RELEASE_NOTES.md
          fi
      - name: Create GitHub release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" --notes-file RELEASE_NOTES.md *.tgz
